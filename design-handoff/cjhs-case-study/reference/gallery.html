<sc-if value="{{ isCsCjhs }}" hint-placeholder-val="{{ false }}">
        <div data-reveal=""><img src="assets/img/case-studies/cjhs/home.png" alt="cjhs.ca homepage" style="width:100%;display:block;border-radius:20px;box-shadow:0 12px 32px rgba(40,40,40,.18);"></div>
        <p style="font-size:18px;color:#282828;line-height:1.4;margin-top:20px;max-width:720px;">The homepage: a clear mission statement up front and the Donate button always in reach.</p>
        <div data-reveal="" style="margin-top:64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(28px,4vw,64px);align-items:center;">
          <video src="assets/img/case-studies/cjhs/scroll.mp4" autoplay="" muted="" loop="" playsinline="" style="width:100%;max-width:360px;justify-self:center;display:block;border-radius:28px;box-shadow:0 12px 32px rgba(40,40,40,.18);background:#282828;"></video>
          <div style="display:flex;flex-direction:column;gap:16px;max-width:520px;">
            <h3 style="font-size:clamp(26px,2.6vw,34px);font-weight:700;text-transform:uppercase;line-height:1.05;color:#282828;">Built for the phone first</h3>

          </div>
        </div>
